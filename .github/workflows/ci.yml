name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controles:
    name: Contrôles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgres:18.7-alpine
        env:
          POSTGRES_USER: hikayat
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: hikayat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hikayat -d hikayat_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      # Base jetable du job : sert au build, aux tests d'intégration et au e2e.
      DATABASE_URL: postgresql://hikayat:ci@127.0.0.1:5432/hikayat_test
      TEST_DATABASE_URL: postgresql://hikayat:ci@127.0.0.1:5432/hikayat_test
      # Origine du `next start` des tests e2e : la canonique et le sitemap doivent la désigner.
      SITE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm vient de `packageManager` (package.json) via Corepack ; avant setup-node pour son cache.
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm test:int
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
